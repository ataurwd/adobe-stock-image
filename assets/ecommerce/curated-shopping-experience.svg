<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    
    <filter id="softDropShadow" x="-15%" y="-15%" width="135%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#14213D" flood-opacity="0.16"/>
    </filter>
    <filter id="cardShadow" x="-12%" y="-10%" width="124%" height="128%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#14213D" flood-opacity="0.12"/>
    </filter>
    <filter id="ambientGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
  </defs>

  <ellipse cx="600" cy="470" rx="490" ry="310" fill="#DBEAFE" opacity="0.45"/>

  <!-- Express Trajectory Ribbon -->
  <path d="M 140 620 C 340 740, 820 180, 1060 290" fill="none" stroke="#FF735C" stroke-width="6" stroke-dasharray="12 10"/>

  <!-- Central 3D Mobile Flagship Storefront -->
  <g filter="url(#softDropShadow)">
    <rect x="420" y="120" width="360" height="660" rx="42" fill="#14213D" stroke="#93C5FD" stroke-width="4"/>
    <rect x="442" y="148" width="316" height="604" rx="28" fill="#FFFFFF"/>
    <!-- Storefront Awning Header -->
    <rect x="442" y="148" width="316" height="110" rx="28" fill="#2563EB"/>
    <text x="600" y="212" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="24" font-weight="800">ATELIER STORE</text>

    <!-- Featured Product Card Inside App -->
    <rect x="472" y="286" width="256" height="260" rx="20" fill="#F8FAFC" stroke="#DBEAFE" stroke-width="2"/>
    <rect x="496" y="310" width="208" height="140" rx="14" fill="#DBEAFE"/>
    <!-- 3D Stylized Product Sneaker / Bag Icon -->
    <path d="M 555 360 L 645 360 L 660 430 L 540 430 Z" fill="#FF735C"/>
    <path d="M 575 360 C 575 330, 625 330, 625 360" fill="none" stroke="#14213D" stroke-width="5"/>
    <rect x="496" y="472" width="130" height="14" rx="7" fill="#14213D"/>
    <text x="496" y="520" fill="#2563EB" font-family="system-ui, sans-serif" font-size="22" font-weight="800">$128.00</text>
    <circle cx="676" cy="508" r="22" fill="#10B981"/>
    <path d="M 668 508 L 684 508 M 676 500 L 676 516" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Instant Checkout Button -->
    <rect x="472" y="585" width="256" height="58" rx="29" fill="#14213D"/>
    <text x="600" y="621" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="17" font-weight="700">1-Click Checkout →</text>
  </g>

  <!-- Floating 5-Star Review Card -->
  <g filter="url(#cardShadow)">
    <rect x="150" y="250" width="240" height="110" rx="20" fill="#FFFFFF" stroke="#FACC15" stroke-width="3"/>
    <text x="270" y="298" text-anchor="middle" fill="#FACC15" font-family="system-ui, sans-serif" font-size="26">★★★★★</text>
    <text x="270" y="332" text-anchor="middle" fill="#14213D" font-family="system-ui, sans-serif" font-size="15" font-weight="700">4.98 Verified Rating</text>

    <!-- Verified Payment Shield Card -->
    <rect x="815" y="450" width="245" height="125" rx="22" fill="#14213D" stroke="#10B981" stroke-width="3"/>
    <circle cx="865" cy="512" r="26" fill="#10B981"/>
    <path d="M 854 512 L 862 520 L 878 504" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <text x="955" y="506" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Encrypted Pay</text>
    <text x="955" y="532" text-anchor="middle" fill="#93C5FD" font-family="system-ui, sans-serif" font-size="13">Instant Dispatch</text>
  </g>
</svg>