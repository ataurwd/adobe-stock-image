<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    
    <filter id="softDropShadow" x="-15%" y="-15%" width="135%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#14213D" flood-opacity="0.16"/>
    </filter>
    <filter id="cardShadow" x="-12%" y="-10%" width="124%" height="128%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#14213D" flood-opacity="0.12"/>
    </filter>
    <filter id="ambientGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
  </defs>

  <ellipse cx="600" cy="480" rx="480" ry="300" fill="#DBEAFE" opacity="0.45"/>

  <!-- 3D Isometric Curated Gift / Order Box -->
  <g filter="url(#softDropShadow)">
    <!-- Box Top -->
    <polygon points="620,340 820,260 980,340 780,420" fill="#DBEAFE" stroke="#FFFFFF" stroke-width="2"/>
    <!-- Box Left Wall -->
    <polygon points="620,340 780,420 780,640 620,560" fill="#2563EB"/>
    <!-- Box Right Wall -->
    <polygon points="780,420 980,340 980,560 780,640" fill="#14213D"/>
    <!-- Coral Ribbon Wrapping -->
    <polygon points="690,312 730,296 890,376 850,392" fill="#FF735C"/>
    <polygon points="850,392 890,376 890,596 850,612" fill="#FF735C"/>
    <!-- Loyalty Reward Badge Above Box -->
    <circle cx="800" cy="210" r="48" fill="#FACC15" stroke="#FFFFFF" stroke-width="4"/>
    <path d="M 800 232 C 780 216, 774 198, 788 190 C 795 186, 800 194, 800 196 C 800 194, 805 186, 812 190 C 826 198, 820 216, 800 232 Z" fill="#FF735C"/>
  </g>

  <!-- Delighted Customer Figure -->
  <g transform="translate(340, 490) scale(1.45, 1.45)">
    <!-- Torso Shadow & Blazer/Sweater -->
    <path d="M -46 135 C -44 65, -28 42, 0 42 C 28 42, 46 65, 48 135 Z" fill="#FF735C"/>
    <!-- Collar / Inner Shirt Accent -->
    <path d="M -14 43 L 0 72 L 14 43 Z" fill="#FFFFFF"/>
    <path d="M -6 56 L 0 92 L 6 56 Z" fill="#FACC15"/>
    <!-- Neck -->
    <rect x="-9" y="20" width="18" height="28" rx="9" fill="#F4B89A"/>
    <path d="M -9 34 Q 0 42 9 32 L 9 42 L -9 42 Z" fill="#D99879" opacity="0.55"/>
    <!-- Head -->
    <ellipse cx="2" cy="4" rx="23" ry="26" fill="#F4B89A"/>
    <!-- Facial Details (Minimal Editorial Style) -->
    <circle cx="11" cy="2" r="2.2" fill="#14213D"/>
    <path d="M 7 -5 Q 12 -8 16 -5" fill="none" stroke="#14213D" stroke-width="2" stroke-linecap="round"/>
    <path d="M 14 4 L 16 10 L 12 11" fill="none" stroke="#C98667" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 6 16 Q 11 20 16 16" fill="none" stroke="#14213D" stroke-width="2" stroke-linecap="round"/>
    <!-- Modern Sculpted Hair -->
    <path d="M -21 8 C -25 -16, -8 -28, 12 -24 C 26 -22, 30 -8, 22 -2 C 14 -10, -2 -10, -10 2 C -14 8, -16 14, -21 8 Z" fill="#14213D"/>
    <circle cx="-18" cy="-8" r="10" fill="#14213D"/>
    <!-- Expressive Reaching Arm -->
    <path d="M 28 58 C 56 64, 78 44, 102 22" fill="none" stroke="#FF735C" stroke-width="20" stroke-linecap="round"/>
    <circle cx="106" cy="18" r="9" fill="#F4B89A"/>
    <path d="M -32 60 C -52 84, -44 114, -18 118" fill="none" stroke="#FF735C" stroke-width="18" stroke-linecap="round"/>
    <circle cx="-14" cy="118" r="8.5" fill="#F4B89A"/>
  </g>

  <!-- Live Order Tracking Pill -->
  <g filter="url(#cardShadow)">
    <rect x="440" y="680" width="420" height="72" rx="36" fill="#FFFFFF" stroke="#10B981" stroke-width="3"/>
    <circle cx="490" cy="716" r="20" fill="#10B981"/>
    <path d="M 482 716 L 488 722 L 500 710" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
    <text x="665" y="723" text-anchor="middle" fill="#14213D" font-family="system-ui, sans-serif" font-size="18" font-weight="800">Delivered with 100% Delight</text>
  </g>
</svg>