<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    
    <filter id="softDropShadow" x="-15%" y="-15%" width="135%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#14213D" flood-opacity="0.16"/>
    </filter>
    <filter id="cardShadow" x="-12%" y="-10%" width="124%" height="128%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#14213D" flood-opacity="0.12"/>
    </filter>
    <filter id="ambientGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
  </defs>

  <circle cx="600" cy="440" r="370" fill="#DBEAFE" opacity="0.4"/>

  <!-- Rising Knowledge Constellation Branches -->
  <g stroke="#2563EB" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M 600 620 C 600 480, 430 430, 360 280"/>
    <path d="M 600 620 C 600 440, 600 320, 600 170"/>
    <path d="M 600 620 C 600 480, 770 430, 840 280"/>
    <path d="M 495 450 C 430 390, 310 410, 250 350" stroke="#10B981"/>
    <path d="M 705 450 C 770 390, 890 410, 950 350" stroke="#FF735C"/>
  </g>

  <!-- Stylized Geometric Leaves & Nodes -->
  <g filter="url(#cardShadow)">
    <path d="M 600 490 C 520 470, 490 400, 560 380 C 600 410, 600 460, 600 490 Z" fill="#10B981"/>
    <path d="M 600 460 C 680 440, 710 370, 640 350 C 600 380, 600 430, 600 460 Z" fill="#2563EB"/>

    <!-- Constellation Milestone Badges -->
    <circle cx="360" cy="280" r="44" fill="#FFFFFF" stroke="#2563EB" stroke-width="4"/>
    <circle cx="360" cy="280" r="20" fill="#2563EB"/>

    <circle cx="600" cy="170" r="56" fill="#FACC15" stroke="#FFFFFF" stroke-width="5"/>
    <polygon points="600,136 610,158 634,161 616,178 621,202 600,190 579,202 584,178 566,161 590,158" fill="#14213D"/>

    <circle cx="840" cy="280" r="44" fill="#FFFFFF" stroke="#FF735C" stroke-width="4"/>
    <circle cx="840" cy="280" r="20" fill="#FF735C"/>

    <circle cx="250" cy="350" r="32" fill="#10B981" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="950" cy="350" r="32" fill="#A78BFA" stroke="#FFFFFF" stroke-width="3"/>
  </g>

  <!-- Open 3D Architectural Book / Knowledge Foundation -->
  <g filter="url(#softDropShadow)">
    <path d="M 600 640 L 290 560 L 290 710 L 600 780 Z" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M 600 640 L 910 560 L 910 710 L 600 780 Z" fill="#14213D" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M 600 615 Q 445 555 310 535 L 310 675 Q 445 695 600 755 Z" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/>
    <path d="M 600 615 Q 755 555 890 535 L 890 675 Q 755 695 600 755 Z" fill="#F8FAFC" stroke="#93C5FD" stroke-width="2"/>
  </g>
</svg>