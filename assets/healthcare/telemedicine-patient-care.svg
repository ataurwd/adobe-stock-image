<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    
    <filter id="softDropShadow" x="-15%" y="-15%" width="135%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#14213D" flood-opacity="0.16"/>
    </filter>
    <filter id="cardShadow" x="-12%" y="-10%" width="124%" height="128%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#14213D" flood-opacity="0.12"/>
    </filter>
    <filter id="ambientGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
  </defs>

  <ellipse cx="600" cy="460" rx="490" ry="310" fill="#DBEAFE" opacity="0.45"/>

  <!-- Clinical Telemedicine Tablet Portal -->
  <g filter="url(#softDropShadow)">
    <rect x="240" y="140" width="520" height="600" rx="34" fill="#14213D" stroke="#93C5FD" stroke-width="4"/>
    <rect x="268" y="172" width="464" height="536" rx="22" fill="#FFFFFF"/>
    <rect x="268" y="172" width="464" height="410" rx="22" fill="#DBEAFE"/>

    <!-- Compassionate Doctor Illustration -->
    <g transform="translate(500, 390) scale(1.38, 1.38)">
    <!-- Torso Shadow & Blazer/Sweater -->
    <path d="M -46 135 C -44 65, -28 42, 0 42 C 28 42, 46 65, 48 135 Z" fill="#FFFFFF"/>
    <!-- Collar / Inner Shirt Accent -->
    <path d="M -14 43 L 0 72 L 14 43 Z" fill="#FFFFFF"/>
    <path d="M -6 56 L 0 92 L 6 56 Z" fill="#2563EB"/>
    <!-- Neck -->
    <rect x="-9" y="20" width="18" height="28" rx="9" fill="#F2B596"/>
    <path d="M -9 34 Q 0 42 9 32 L 9 42 L -9 42 Z" fill="#D99879" opacity="0.55"/>
    <!-- Head -->
    <ellipse cx="2" cy="4" rx="23" ry="26" fill="#F2B596"/>
    <!-- Facial Details (Minimal Editorial Style) -->
    <circle cx="11" cy="2" r="2.2" fill="#14213D"/>
    <path d="M 7 -5 Q 12 -8 16 -5" fill="none" stroke="#14213D" stroke-width="2" stroke-linecap="round"/>
    <path d="M 14 4 L 16 10 L 12 11" fill="none" stroke="#C98667" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 6 16 Q 11 20 16 16" fill="none" stroke="#14213D" stroke-width="2" stroke-linecap="round"/>
    <!-- Modern Sculpted Hair -->
    <path d="M -21 8 C -25 -16, -8 -28, 12 -24 C 26 -22, 30 -8, 22 -2 C 14 -10, -2 -10, -10 2 C -14 8, -16 14, -21 8 Z" fill="#14213D"/>
    <circle cx="-18" cy="-8" r="10" fill="#14213D"/>
    <!-- Warm Waving Gesture -->
    <path d="M 28 56 C 62 46, 82 18, 76 -14" fill="none" stroke="#FFFFFF" stroke-width="19" stroke-linecap="round"/>
    <circle cx="75" cy="-18" r="9" fill="#F2B596"/>
  </g>

    <!-- Medical Cross Badge -->
    <circle cx="330" cy="235" r="28" fill="#10B981"/>
    <rect x="323" y="219" width="14" height="32" rx="4" fill="#FFFFFF"/>
    <rect x="314" y="228" width="32" height="14" rx="4" fill="#FFFFFF"/>

    <!-- Bottom Call Controls -->
    <circle cx="440" cy="645" r="26" fill="#DBEAFE"/>
    <circle cx="500" cy="645" r="30" fill="#FF735C"/>
    <circle cx="560" cy="645" r="26" fill="#DBEAFE"/>
  </g>

  <!-- Floating Biometric Heart-Rate & Vitals Card -->
  <g filter="url(#softDropShadow)">
    <rect x="660" y="250" width="380" height="210" rx="24" fill="#FFFFFF" stroke="#10B981" stroke-width="3"/>
    <circle cx="715" cy="305" r="24" fill="#FFE4E0"/>
    <path d="M 715 318 C 700 306, 696 292, 706 286 C 712 282, 715 288, 715 290 C 715 288, 718 282, 724 286 C 734 292, 730 306, 715 318 Z" fill="#FF735C"/>
    <text x="755" y="302" fill="#1F2937" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Heart Rhythm &amp; SpO2</text>
    <text x="755" y="330" fill="#14213D" font-family="system-ui, sans-serif" font-size="26" font-weight="800">72 BPM · 99%</text>
    <!-- ECG Waveform -->
    <path d="M 700 400 L 765 400 L 785 360 L 805 430 L 828 345 L 850 415 L 870 390 L 995 390" fill="none" stroke="#10B981" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Prescription / Care Plan Card -->
  <g filter="url(#cardShadow)">
    <rect x="700" y="500" width="320" height="140" rx="22" fill="#14213D"/>
    <circle cx="750" cy="570" r="26" fill="#2563EB"/>
    <path d="M 740 570 L 748 578 L 762 562" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="795" y="548" width="180" height="14" rx="7" fill="#FFFFFF"/>
    <rect x="795" y="574" width="130" height="12" rx="6" fill="#93C5FD"/>
  </g>
</svg>