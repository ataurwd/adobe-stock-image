    <circle cx="-18" cy="-8" r="10" fill="#1F2937"/>
    <!-- Warm Waving Gesture -->
    <path d="M 28 56 C 62 46, 82 18, 76 -14" fill="none" stroke="#2563EB" stroke-width="19" stroke-linecap="round"/>
    <circle cx="75" cy="-18" r="9" fill="#C67D5A"/>
  </g>
    <rect x="840" y="462" width="120" height="16" rx="8" fill="#14213D"/>
    <circle cx="1035" cy="470" r="10" fill="#10B981"/>
  </g>

  <!-- Center Bottom Hub Frame -->
  <g filter="url(#softDropShadow)">
    <rect x="445" y="440" width="310" height="330" rx="26" fill="#14213D" stroke="#93C5FD" stroke-width="3"/>
    <rect x="465" y="460" width="270" height="250" rx="18" fill="#1E3A8A"/>
    <g transform="translate(600, 560) scale(1.12, 1.12)">
    <!-- Torso Shadow & Blazer/Sweater -->
    <path d="M -46 135 C -44 65, -28 42, 0 42 C 28 42, 46 65, 48 135 Z" fill="#10B981"/>
    <!-- Collar / Inner Shirt Accent -->
    <path d="M -14 43 L 0 72 L 14 43 Z" fill="#FFFFFF"/>
    <path d="M -6 56 L 0 92 L 6 56 Z" fill="#FACC15"/>
