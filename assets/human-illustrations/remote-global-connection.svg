    <path d="M -9 34 Q 0 42 9 32 L 9 42 L -9 42 Z" fill="#D99879" opacity="0.55"/>
    <!-- Head -->
    <ellipse cx="2" cy="4" rx="23" ry="26" fill="#F5C1A6"/>
    <!-- Facial Details (Minimal Editorial Style) -->
