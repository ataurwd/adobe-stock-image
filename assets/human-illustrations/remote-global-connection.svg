    <circle cx="-18" cy="-8" r="10" fill="#14213D"/>
    <!-- Balanced Workspace Arms -->
    <path d="M 26 58 C 48 78, 62 94, 82 92" fill="none" stroke="#10B981" stroke-width="19" stroke-linecap="round"/>
    <circle cx="86" cy="92" r="8.5" fill="#F5C1A6"/>
    <path d="M -28 60 C -14 86, 12 96, 44 95" fill="none" stroke="#119b73" stroke-width="18" stroke-linecap="round"/>
    <circle cx="48" cy="95" r="8" fill="#F5C1A6"/>
  </g>
    <!-- Audio Waveform Pill -->
    <rect x="520" y="726" width="160" height="24" rx="12" fill="#2563EB"/>
    <g stroke="#FFFFFF" stroke-width="3" stroke-linecap="round">
      <line x1="555" y1="738" x2="555" y2="738"/>
      <line x1="570" y1="732" x2="570" y2="744"/>
      <line x1="585" y1="729" x2="585" y2="747"/>
      <line x1="600" y1="734" x2="600" y2="742"/>
      <line x1="615" y1="730" x2="615" y2="746"/>
      <line x1="630" y1="733" x2="630" y2="743"/>
      <line x1="645" y1="736" x2="645" y2="740"/>
    </g>
  </g>

  <!-- Top Shared Sync Badge -->
  <g filter="url(#cardShadow)">
    <rect x="490" y="155" width="220" height="56" rx="28" fill="#2563EB"/>
    <circle cx="530" cy="183" r="12" fill="#FACC15"/>
    <text x="615" y="189" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Global Sync Live</text>
  </g>
</svg>