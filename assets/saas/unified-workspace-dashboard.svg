<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  <defs>
    
    <filter id="softDropShadow" x="-15%" y="-15%" width="135%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#14213D" flood-opacity="0.16"/>
    </filter>
    <filter id="cardShadow" x="-12%" y="-10%" width="124%" height="128%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#14213D" flood-opacity="0.12"/>
    </filter>
    <filter id="ambientGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
    <linearGradient id="chartAreaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Ambient Perspective Backdrop -->
  <ellipse cx="800" cy="500" rx="640" ry="380" fill="#DBEAFE" opacity="0.45"/>

  <!-- Main Elevated SaaS Dashboard Shell -->
  <g filter="url(#softDropShadow)">
    <rect x="200" y="130" width="1140" height="720" rx="28" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2.5"/>
    <!-- Left Navigation Sidebar -->
    <path d="M 228 130 L 420 130 L 420 850 L 228 850 Q 200 850 200 822 L 200 158 Q 200 130 228 130 Z" fill="#14213D"/>
    <circle cx="252" cy="182" r="14" fill="#FF735C"/>
    <rect x="280" y="174" width="100" height="16" rx="8" fill="#FFFFFF"/>
    <!-- Sidebar Menu Items -->
    <rect x="228" y="240" width="164" height="44" rx="12" fill="#2563EB"/>
    <rect x="252" y="256" width="96" height="12" rx="6" fill="#FFFFFF"/>
    <rect x="252" y="312" width="110" height="12" rx="6" fill="#93C5FD" opacity="0.65"/>
    <rect x="252" y="362" width="88" height="12" rx="6" fill="#93C5FD" opacity="0.65"/>
    <rect x="252" y="412" width="120" height="12" rx="6" fill="#93C5FD" opacity="0.65"/>
    <rect x="252" y="462" width="94" height="12" rx="6" fill="#93C5FD" opacity="0.65"/>

    <!-- Top KPI Row -->
    <rect x="464" y="176" width="260" height="130" rx="18" fill="#F8FAFC" stroke="#DBEAFE" stroke-width="2"/>
    <circle cx="506" cy="220" r="20" fill="#DBEAFE"/>
    <rect x="540" y="208" width="110" height="12" rx="6" fill="#1F2937"/>
    <text x="490" y="278" fill="#14213D" font-family="system-ui, sans-serif" font-size="34" font-weight="800">$148.4K</text>
    <rect x="642" y="256" width="60" height="24" rx="12" fill="#D1FAE5"/>
    <text x="672" y="273" text-anchor="middle" fill="#10B981" font-family="system-ui, sans-serif" font-size="13" font-weight="700">+32%</text>

    <rect x="752" y="176" width="260" height="130" rx="18" fill="#F8FAFC" stroke="#DBEAFE" stroke-width="2"/>
    <circle cx="794" cy="220" r="20" fill="#FFE4E0"/>
    <rect x="828" y="208" width="110" height="12" rx="6" fill="#1F2937"/>
    <text x="778" y="278" fill="#14213D" font-family="system-ui, sans-serif" font-size="34" font-weight="800">99.98%</text>

    <rect x="1040" y="176" width="256" height="130" rx="18" fill="#F8FAFC" stroke="#DBEAFE" stroke-width="2"/>
    <circle cx="1082" cy="220" r="20" fill="#EDE9FE"/>
    <rect x="1116" y="208" width="110" height="12" rx="6" fill="#1F2937"/>
    <text x="1066" y="278" fill="#14213D" font-family="system-ui, sans-serif" font-size="34" font-weight="800">12.4M</text>

    <!-- Primary Spline Analytics Panel -->
    <rect x="464" y="336" width="550" height="468" rx="22" fill="#F8FAFC" stroke="#DBEAFE" stroke-width="2"/>
    <rect x="498" y="370" width="180" height="16" rx="8" fill="#14213D"/>
    <path d="M 498 690 C 570 670, 610 560, 680 575 C 750 590, 790 460, 865 480 C 920 495, 950 410, 980 395 L 980 740 L 498 740 Z" fill="url(#chartAreaGrad)"/>
    <path d="M 498 690 C 570 670, 610 560, 680 575 C 750 590, 790 460, 865 480 C 920 495, 950 410, 980 395" fill="none" stroke="#2563EB" stroke-width="5" stroke-linecap="round"/>
    <circle cx="680" cy="575" r="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="4"/>
    <circle cx="865" cy="480" r="8" fill="#FFFFFF" stroke="#FF735C" stroke-width="4"/>
    <circle cx="980" cy="395" r="9" fill="#10B981" stroke="#FFFFFF" stroke-width="3"/>

    <!-- Right Activity & Task Stack -->
    <rect x="1040" y="336" width="256" height="468" rx="22" fill="#14213D"/>
    <rect x="1070" y="370" width="140" height="16" rx="8" fill="#FFFFFF"/>
    <rect x="1068" y="416" width="200" height="96" rx="16" fill="#1E3A8A"/>
    <circle cx="1104" cy="464" r="18" fill="#FF735C"/>
    <rect x="1136" y="448" width="108" height="12" rx="6" fill="#FFFFFF"/>
    <rect x="1136" y="470" width="76" height="10" rx="5" fill="#93C5FD"/>

    <rect x="1068" y="532" width="200" height="96" rx="16" fill="#1E3A8A"/>
    <circle cx="1104" cy="580" r="18" fill="#10B981"/>
    <rect x="1136" y="564" width="108" height="12" rx="6" fill="#FFFFFF"/>
    <rect x="1136" y="586" width="84" height="10" rx="5" fill="#93C5FD"/>

    <rect x="1068" y="648" width="200" height="120" rx="16" fill="#2563EB"/>
    <circle cx="1168" cy="708" r="34" fill="none" stroke="#FACC15" stroke-width="8" stroke-dasharray="165 60"/>
    <text x="1168" y="715" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="800">86%</text>
  </g>

  <!-- Floating Glass Command Palette Overlay -->
  <g filter="url(#softDropShadow)">
    <rect x="110" y="520" width="320" height="190" rx="22" fill="#FFFFFF" stroke="#FF735C" stroke-width="3"/>
    <rect x="138" y="550" width="110" height="28" rx="14" fill="#FFE4E0"/>
    <text x="193" y="569" text-anchor="middle" fill="#FF735C" font-family="system-ui, sans-serif" font-size="13" font-weight="800">AI INSIGHT</text>
    <rect x="138" y="598" width="240" height="14" rx="7" fill="#14213D"/>
    <rect x="138" y="624" width="200" height="12" rx="6" fill="#93C5FD"/>
    <rect x="138" y="656" width="130" height="32" rx="16" fill="#2563EB"/>
  </g>
</svg>