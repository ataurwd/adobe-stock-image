<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    
    <filter id="softDropShadow" x="-15%" y="-15%" width="135%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#14213D" flood-opacity="0.16"/>
    </filter>
    <filter id="cardShadow" x="-12%" y="-10%" width="124%" height="128%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#14213D" flood-opacity="0.12"/>
    </filter>
    <filter id="ambientGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
    <linearGradient id="shieldLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#14213D"/>
    </linearGradient>
    <linearGradient id="shieldRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14213D"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>
  </defs>

  <!-- Security Radar Rings -->
  <circle cx="600" cy="460" r="360" fill="#DBEAFE" opacity="0.35"/>
  <circle cx="600" cy="460" r="290" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="10 10" opacity="0.5"/>

  <!-- Smooth Cloud Silhouette Base -->
  <g filter="url(#softDropShadow)">
    <path d="M 330 560 C 250 560, 210 495, 250 430 C 260 340, 350 290, 435 320 C 485 235, 625 225, 695 295 C 785 270, 885 330, 890 420 C 955 445, 955 560, 865 560 Z" fill="#FFFFFF" stroke="#93C5FD" stroke-width="3"/>
  </g>

  <!-- 3D Faceted Security Shield -->
  <g filter="url(#softDropShadow)">
    <!-- Outer Bevel Shield -->
    <path d="M 600 185 L 810 265 L 810 455 C 810 610, 600 725, 600 725 C 600 725, 390 610, 390 455 L 390 265 Z" fill="#93C5FD" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
    <!-- Inner Left Facet -->
    <path d="M 600 215 L 600 692 C 600 692, 420 588, 420 450 L 420 285 Z" fill="url(#shieldLeft)"/>
    <!-- Inner Right Facet -->
    <path d="M 600 215 L 780 285 L 780 450 C 780 588, 600 692, 600 692 Z" fill="url(#shieldRight)"/>
    <!-- Emerald Verification Emblem -->
    <circle cx="600" cy="445" r="76" fill="#10B981" stroke="#FFFFFF" stroke-width="5"/>
    <path d="M 566 445 L 590 470 L 638 420" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Floating Encryption Key Cards -->
  <g filter="url(#cardShadow)">
    <rect x="170" y="250" width="185" height="74" rx="18" fill="#14213D" stroke="#2563EB" stroke-width="2"/>
    <circle cx="212" cy="287" r="14" fill="#FACC15"/>
    <rect x="240" y="275" width="90" height="10" rx="5" fill="#FFFFFF"/>
    <rect x="240" y="293" width="64" height="8" rx="4" fill="#93C5FD"/>

    <rect x="845" y="540" width="195" height="74" rx="18" fill="#14213D" stroke="#10B981" stroke-width="2"/>
    <circle cx="887" cy="577" r="14" fill="#10B981"/>
    <rect x="915" y="565" width="96" height="10" rx="5" fill="#FFFFFF"/>
    <rect x="915" y="583" width="72" height="8" rx="4" fill="#93C5FD"/>
  </g>
</svg>