<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    
    <filter id="softDropShadow" x="-15%" y="-15%" width="135%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#14213D" flood-opacity="0.16"/>
    </filter>
    <filter id="cardShadow" x="-12%" y="-10%" width="124%" height="128%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#14213D" flood-opacity="0.12"/>
    </filter>
    <filter id="ambientGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
  </defs>

  <ellipse cx="400" cy="320" rx="260" ry="175" fill="#DBEAFE" opacity="0.5"/>

  <!-- 3D Architectural Blueprint Folder -->
  <g filter="url(#softDropShadow)">
    <path d="M 210 210 L 330 210 L 365 245 L 590 245 L 590 450 L 210 450 Z" fill="#14213D" rx="18"/>
    <rect x="235" y="185" width="330" height="220" rx="16" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2.5" transform="rotate(-4 400 295)"/>
    <!-- Blueprint Grid Lines on Card -->
    <g stroke="#DBEAFE" stroke-width="2" transform="rotate(-4 400 295)">
      <rect x="265" y="215" width="110" height="75" rx="10" fill="#DBEAFE"/>
      <rect x="395" y="215" width="140" height="16" rx="8" fill="#93C5FD"/>
      <rect x="395" y="245" width="100" height="12" rx="6" fill="#DBEAFE"/>
    </g>
    <!-- Front Folder Flap -->
    <path d="M 195 275 L 605 275 L 585 455 L 215 455 Z" fill="#2563EB" stroke="#93C5FD" stroke-width="2"/>
  </g>

  <!-- Floating Create '+' Spark Badge -->
  <g filter="url(#cardShadow)">
    <circle cx="555" cy="215" r="46" fill="#FF735C" stroke="#FFFFFF" stroke-width="4"/>
    <path d="M 555 193 L 555 237 M 533 215 L 577 215" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    <circle cx="240" cy="175" r="14" fill="#FACC15"/>
    <circle cx="620" cy="340" r="10" fill="#10B981"/>
  </g>
</svg>