<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <filter id="softDropShadow" x="-15%" y="-15%" width="135%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#14213D" flood-opacity="0.16"/>
    </filter>
    <filter id="cardShadow" x="-12%" y="-10%" width="124%" height="128%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#14213D" flood-opacity="0.12"/>
    </filter></defs>
  <ellipse cx="400" cy="300" rx="260" ry="175" fill="#DBEAFE" opacity="0.48"/>

  <!-- Disconnected 3D Magnetic Plugs with Reconnect Spark -->
  <g filter="url(#softDropShadow)">
    <!-- Left Cable & Plug -->
    <path d="M 90 360 C 160 360, 190 300, 250 300" fill="none" stroke="#14213D" stroke-width="18" stroke-linecap="round"/>
    <rect x="240" y="255" width="95" height="90" rx="18" fill="#2563EB" stroke="#FFFFFF" stroke-width="3"/>
    <rect x="335" y="272" width="28" height="16" rx="6" fill="#FACC15"/>
    <rect x="335" y="312" width="28" height="16" rx="6" fill="#FACC15"/>

    <!-- Right Socket & Cable -->
    <path d="M 550 300 C 610 300, 640 240, 710 240" fill="none" stroke="#14213D" stroke-width="18" stroke-linecap="round"/>
    <rect x="465" y="255" width="95" height="90" rx="18" fill="#14213D" stroke="#FFFFFF" stroke-width="3"/>

    <!-- Center Alert Pulse Badge -->
    <circle cx="408" cy="300" r="34" fill="#FF735C" stroke="#FFFFFF" stroke-width="4"/>
    <line x1="408" y1="282" x2="408" y2="304" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    <circle cx="408" cy="316" r="3.5" fill="#FFFFFF"/>
  </g>
</svg>