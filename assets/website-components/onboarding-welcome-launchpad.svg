<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <filter id="softDropShadow" x="-15%" y="-15%" width="135%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#14213D" flood-opacity="0.16"/>
    </filter>
    <filter id="cardShadow" x="-12%" y="-10%" width="124%" height="128%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#14213D" flood-opacity="0.12"/>
    </filter></defs>
  <ellipse cx="400" cy="310" rx="265" ry="180" fill="#DBEAFE" opacity="0.5"/>

  <!-- Guided Onboarding Checklist Card & Ascending Launch Rocket/Prism -->
  <g filter="url(#softDropShadow)">
    <rect x="170" y="150" width="320" height="310" rx="24" fill="#FFFFFF" stroke="#2563EB" stroke-width="3"/>
    <rect x="205" y="190" width="150" height="18" rx="9" fill="#14213D"/>

    <!-- Step 1 Done -->
    <circle cx="225" cy="255" r="18" fill="#10B981"/>
    <path d="M 218 255 L 224 261 L 234 249" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <rect x="258" y="248" width="180" height="14" rx="7" fill="#14213D"/>

    <!-- Step 2 Done -->
    <circle cx="225" cy="315" r="18" fill="#10B981"/>
    <path d="M 218 315 L 224 321 L 234 309" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <rect x="258" y="308" width="160" height="14" rx="7" fill="#14213D"/>

    <!-- Step 3 Active -->
    <circle cx="225" cy="375" r="18" fill="#FF735C"/>
    <circle cx="225" cy="375" r="7" fill="#FFFFFF"/>
    <rect x="258" y="368" width="190" height="14" rx="7" fill="#2563EB"/>

    <!-- Ascending 3D Launch Badge -->
    <circle cx="555" cy="285" r="88" fill="#14213D" stroke="#93C5FD" stroke-width="4"/>
    <polygon points="555,220 595,315 555,295 515,315" fill="#FF735C" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="555" cy="335" r="14" fill="#FACC15"/>
  </g>
</svg>