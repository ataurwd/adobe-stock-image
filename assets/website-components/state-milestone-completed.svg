<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    
    <filter id="softDropShadow" x="-15%" y="-15%" width="135%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#14213D" flood-opacity="0.16"/>
    </filter>
    <filter id="cardShadow" x="-12%" y="-10%" width="124%" height="128%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#14213D" flood-opacity="0.12"/>
    </filter>
    <filter id="ambientGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
    <linearGradient id="successEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <circle cx="400" cy="300" r="215" fill="#DBEAFE" opacity="0.5"/>
  <circle cx="400" cy="300" r="165" fill="#D1FAE5" opacity="0.65"/>

  <!-- Geometric Celebration Accents -->
  <g>
    <circle cx="205" cy="175" r="16" fill="#FACC15"/>
    <circle cx="605" cy="185" r="14" fill="#FF735C"/>
    <circle cx="185" cy="395" r="12" fill="#2563EB"/>
    <circle cx="615" cy="405" r="18" fill="#A78BFA"/>
    <polygon points="400,75 408,95 428,98 412,112 416,132 400,122 384,132 388,112 372,98 392,95" fill="#FACC15"/>
  </g>

  <!-- 3D Beveled Emerald Completion Medallion -->
  <g filter="url(#softDropShadow)">
    <circle cx="400" cy="312" r="118" fill="#14213D"/>
    <circle cx="400" cy="298" r="118" fill="url(#successEmerald)" stroke="#FFFFFF" stroke-width="6"/>
    <circle cx="400" cy="298" r="92" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="8 8" opacity="0.7"/>
    <path d="M 352 298 L 386 332 L 454 264" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>